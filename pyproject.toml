[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ffclip"
version = "0.1.0"
description = "Humane ffmpeg: the 10 media recipes everyone googles, with sane defaults"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AP", email = "intertermux@gmail.com" }]
keywords = ["ffmpeg", "video", "audio", "gif", "cli", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/intertermux-code/ffclip"
Issues = "https://github.com/intertermux-code/ffclip/issues"

[project.scripts]
ffclip = "ffclip:main"

[tool.setuptools.packages.find]
where = ["src"]
